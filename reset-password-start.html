<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Continue Password Reset — Footy Status</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reset-password.css" />
</head>
<body>
  <main class="reset-shell">
    <div class="reset-brand" aria-label="Footy Status">
      <img src="assets/footy-status-header-logo.png" alt="Footy Status" width="220" height="88" />
    </div>

    <section class="reset-card state-center" aria-live="polite">
      <span class="security-mark" aria-hidden="true">✓</span>
      <h1>Continue to reset your password</h1>
      <p>For your security, Footy Status will continue to your password reset only after you confirm below.</p>
      <p class="supporting-copy">This extra step helps prevent email security scanners and link previews from using your reset link before you do.</p>
      <p class="form-error" id="startError" role="alert"></p>
      <div class="actions">
        <button class="primary-button" id="continueButton" type="button">Continue to Password Reset</button>
        <a class="secondary-button" href="https://footystatus.com">Return to Footy Status</a>
      </div>
    </section>
  </main>
  <script type="module" src="js/reset-password-start.js"></script>
</body>
</html>
